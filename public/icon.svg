<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="owlBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Rounded playful tile -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- Subtle sparkle stars -->
  <circle cx="22" cy="24" r="4" fill="#fef08a"/>
  <circle cx="106" cy="28" r="3" fill="#fef08a"/>
  <path d="M104 94 l2.5 5 5.5 0.8 -4 3.8 1 5.4 -5 -2.6 -5 2.6 1 -5.4 -4 -3.8 5.5 -0.8z" fill="#fde047"/>

  <!-- Owl body -->
  <ellipse cx="64" cy="78" rx="36" ry="34" fill="url(#owlBody)"/>
  <!-- Owl belly -->
  <ellipse cx="64" cy="90" rx="22" ry="18" fill="#dcfce7"/>
  <!-- Cute wings -->
  <ellipse cx="30" cy="80" rx="9" ry="17" transform="rotate(14 30 80)" fill="#15803d"/>
  <ellipse cx="98" cy="80" rx="9" ry="17" transform="rotate(-14 98 80)" fill="#15803d"/>
  <!-- Ear tufts -->
  <polygon points="36,52 44,38 52,50" fill="#16a34a"/>
  <polygon points="92,52 84,38 76,50" fill="#16a34a"/>

  <!-- Big expressive eyes -->
  <circle cx="51" cy="65" r="13" fill="#ffffff"/>
  <circle cx="77" cy="65" r="13" fill="#ffffff"/>
  <circle cx="53" cy="65" r="7" fill="#0f172a"/>
  <circle cx="75" cy="65" r="7" fill="#0f172a"/>
  <circle cx="55.5" cy="62.5" r="2.5" fill="#ffffff"/>
  <circle cx="77.5" cy="62.5" r="2.5" fill="#ffffff"/>

  <!-- Cute orange beak -->
  <polygon points="64,70 57,78 71,78" fill="#f59e0b"/>

  <!-- Mini British Union Jack cap/badge on top of head -->
  <g transform="translate(46, 20)">
    <rect x="0" y="6" width="36" height="22" rx="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
    <path d="M2 8 L34 26 M34 8 L2 26" stroke="#ffffff" stroke-width="4"/>
    <path d="M2 8 L34 26 M34 8 L2 26" stroke="#ef4444" stroke-width="2"/>
    <path d="M18 6 V28 M0 17 H36" stroke="#ffffff" stroke-width="6"/>
    <path d="M18 6 V28 M0 17 H36" stroke="#ef4444" stroke-width="3.2"/>
  </g>

  <!-- Friendly "EN" badge on belly -->
  <text x="64" y="96" font-family="ui-rounded, system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#15803d">EN</text>
</svg>
